name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # 判定そのものは何にも頼らない。処理系はテストで見本を実際に動かして答え合わせするためだけに入れる。
      - name: Install interpreters for TestRealOutput
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ruby php-cli lua5.4 tcl zsh fish
      - run: go vet ./...
      - run: go test -v ./...
